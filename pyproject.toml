[project]
name = "user-service"
version = "0.1.0"
description = "Ein Flask-Microservice"
requires-python = ">=3.11"
dependencies = [
    "flask>=3.1,<4",
    "pika>=1.3,<2",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]